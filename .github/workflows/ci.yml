name: lab-ci

on:
  push:
    branches: [master]
  pull_request:

# E2E only. The lab's verification battery (installer + pytest + outcome
# collect + design verifier + ledgers) runs locally via `bash tools/check.sh`
# on this Mac before any PR is opened; CI's job is to catch the one thing
# local runs cannot: a fresh checkout where the webapp doesn't actually start.
# Lab owner directive 2026-09-20: drop the OS-matrix verify job and the
# informational windows job — CI runs only the browser e2e suite on ubuntu.
#
# Implication: lab_gate.py's CI-green requirement (LAB_IMPROVEMENT_PLAN v1.7
# §5 R3 acceptance) loses its input. Owner approved; the gate's CI-green
# check is replaced by an explicit "local check.sh PASS recorded in the PR
# body" precondition. Follow-up PR will update lab_gate.py to read that
# signal.

jobs:
  e2e:
    name: browser e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # e2e needs the console's real data plumbing but no science deps
      - name: Install playwright (+ numpy for the sandbox-fit endpoint)
        run: |
          python3 -m pip install -r requirements-dev.txt numpy
          python3 -m playwright install --with-deps chromium

      - name: Start console
        run: |
          python3 webapp/server.py 8799 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8799/api/state >/dev/null && break
            sleep 0.5
          done

      - name: Run browser suites
        run: |
          set -e
          for t in console ledger admin agents approvals equations \
                   experiments help theorems wizard; do
            echo "── e2e: $t"
            python3 webapp/test_${t}_e2e.py http://localhost:8799
          done
